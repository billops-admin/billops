envVarGroups:
  - name: billops-internal
    envVars:
      - key: CRON_SECRET
        generateValue: true

services:
  - type: web
    name: billops
    runtime: node
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    initialDeployHook: npm run backfill -- 2026-08 2026-10
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: BILLOPS_DB_PATH
        value: /var/data/billops.db
      - key: BILLOPS_OUTBOX_DIR
        value: /var/data/outbox
      - key: BILLOPS_SEED_CATALOG
        value: "true"
      - key: BILLOPS_PENDING_BILLS
        value: NetworkTech Lab
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: BILLOPS_ADMIN_NAME
        value: BillOps Admin
      - key: BILLOPS_ADMIN_EMAIL
        sync: false
      - key: BILLOPS_ADMIN_PASSWORD
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - fromGroup: billops-internal
    disk:
      name: billops-data
      mountPath: /var/data
      sizeGB: 1

  - type: cron
    name: billops-scheduler
    runtime: node
    schedule: "*/15 * * * *"
    buildCommand: npm ci --include=dev
    startCommand: node scripts/cron-run.mjs
    envVars:
      - key: BILLOPS_WEB_HOSTPORT
        fromService:
          type: web
          name: billops
          property: hostport
      - fromGroup: billops-internal
