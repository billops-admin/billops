envVarGroups:
  - name: billops-internal
    envVars:
      - key: CRON_SECRET
        generateValue: true

services:
  - type: web
    name: billops
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run backfill -- 2026-08 2026-10 && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: BILLOPS_SEED_CATALOG
        value: "true"
      - key: BILLOPS_PENDING_BILLS
        value: NetworkTech Lab
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: BILLOPS_ADMIN_NAME
        value: BillOps Admin
      - key: BILLOPS_ADMIN_EMAIL
        sync: false
      - key: BILLOPS_ADMIN_PASSWORD
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - fromGroup: billops-internal
